---
- name: Deploy the healthy nginx-wrong-api infrastructure
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  vars:
    exercise_root: /opt/incidentctl/nginx-wrong-api
    app_root: "{{ exercise_root }}/echo-server"
    app_image: incidentsim/echo-server:local
    app_container: incidentsim-echo-server
    docker_package_version: 29.1.3-0ubuntu3~24.04.2
    nginx_package_version: 1.24.0-2ubuntu7.19

  tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is version("24.04", ">=")
          - ansible_facts.distribution_version is version("24.10", "<")
        fail_msg: This exercise requires Ubuntu 24.04.

    - name: Install infrastructure packages at recorded versions
      ansible.builtin.apt:
        name:
          - "docker.io={{ docker_package_version }}"
          - "nginx={{ nginx_package_version }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
        policy_rc_d: 101

    - name: Create the Docker configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Use the cgroupfs driver for container VM compatibility
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "exec-opts": ["native.cgroupdriver=cgroupfs"]
          }
      notify: Restart Docker

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Apply Docker daemon configuration before building images
      ansible.builtin.meta: flush_handlers

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ app_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the echo-server source
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../apps/echo-server/app.py"
        dest: "{{ app_root }}/app.py"
        owner: root
        group: root
        mode: "0644"
      register: app_source

    - name: Copy the echo-server Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../apps/echo-server/Dockerfile"
        dest: "{{ app_root }}/Dockerfile"
        owner: root
        group: root
        mode: "0644"
      register: app_dockerfile

    - name: Check whether the echo-server image exists
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ app_image }}"]
      register: app_image_inspect
      changed_when: false
      failed_when: false

    - name: Build the echo-server image
      ansible.builtin.command:
        argv: [docker, build, --tag, "{{ app_image }}", "{{ app_root }}"]
      when: app_source.changed or app_dockerfile.changed or app_image_inspect.rc != 0
      notify: Restart echo-server

    - name: Install the echo-server systemd unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/echo-server.service.j2"
        dest: /etc/systemd/system/incidentsim-echo-server.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart echo-server

    - name: Enable the echo-server service
      ansible.builtin.systemd_service:
        name: incidentsim-echo-server.service
        enabled: true
        daemon_reload: true
        state: started

    - name: Install the local-only Nginx monitoring snippet
      ansible.builtin.template:
        src: "{{ playbook_dir }}/monitoring/nginx-status.conf.j2"
        dest: /etc/nginx/snippets/incidentsim-monitoring.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx

    - name: Create the Nginx systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/nginx.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Run Nginx in the foreground for container VM compatibility
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/nginx-systemd-override.conf.j2"
        dest: /etc/systemd/system/nginx.service.d/incidentctl.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx

    - name: Install the healthy Nginx virtual host
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/nginx.conf.j2"
        dest: /etc/nginx/sites-available/incidentsim
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx

    - name: Enable the incidentsim Nginx virtual host
      ansible.builtin.file:
        src: /etc/nginx/sites-available/incidentsim
        dest: /etc/nginx/sites-enabled/incidentsim
        state: link
      notify: Restart Nginx

    - name: Disable the default Nginx virtual host
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Apply service and Nginx changes before smoke tests
      ansible.builtin.meta: flush_handlers

    - name: Wait for the echo-server health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
        return_content: true
        status_code: 200
      register: echo_health
      retries: 15
      delay: 2
      until: echo_health.status == 200

    - name: Check the healthy request path through Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: infra-smoke.incidentsim.test
        return_content: true
        status_code: 200
      register: infra_smoke

    - name: Require Nginx to preserve the Host header
      ansible.builtin.assert:
        that:
          - infra_smoke.json.host == "infra-smoke.incidentsim.test"
        fail_msg: The healthy infrastructure did not preserve the request Host header.

  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Restart echo-server
      ansible.builtin.systemd_service:
        name: incidentsim-echo-server.service
        daemon_reload: true
        state: restarted

    - name: Validate Nginx configuration
      ansible.builtin.command: /usr/sbin/nginx -t
      changed_when: false
      listen: Restart Nginx

    - name: Restart Nginx service
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        daemon_reload: true
        state: restarted
      listen: Restart Nginx
