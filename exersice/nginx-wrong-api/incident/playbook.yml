---
- name: Introduce the wrong Host forwarding incident
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Check that the exercise Nginx configuration exists
      ansible.builtin.stat:
        path: /etc/nginx/sites-available/incidentsim
      register: nginx_exercise_config

    - name: Require the infrastructure to be deployed first
      ansible.builtin.assert:
        that:
          - nginx_exercise_config.stat.isreg | default(false)
        fail_msg: Run the infra playbook before introducing the incident.

    - name: Replace the client Host with the upstream address
      ansible.builtin.replace:
        path: /etc/nginx/sites-available/incidentsim
        regexp: '^(\s*)proxy_set_header Host .+;$'
        replace: '\1proxy_set_header Host $proxy_host;'
      notify: Restart Nginx

  handlers:
    - name: Validate Nginx configuration
      ansible.builtin.command: /usr/sbin/nginx -t
      changed_when: false
      listen: Restart Nginx

    - name: Restart Nginx service
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
      listen: Restart Nginx
